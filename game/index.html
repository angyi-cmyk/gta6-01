<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay Nights — a 3D open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070714; }
  /* Two stacked canvases: the 3D city (WebGL) below, the 2D HUD above it. */
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gl { z-index: 0; }
  #hud { z-index: 1; pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="gl" width="1280" height="720" aria-label="Neon Bay Nights: a 3D open-world crime game. Steal cars, outrun the police, run ten jobs for Delia Voss."></canvas>
<canvas id="hud" width="1280" height="720"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
